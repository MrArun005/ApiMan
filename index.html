<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ApiMan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23193a5c'/><path d='M7 20c4 0 4-8 9-8s5 8 9 8' stroke='%23f2b33d' stroke-width='3' fill='none' stroke-linecap='round'/><circle cx='7' cy='20' r='2.6' fill='%2347b881'/><circle cx='25' cy='20' r='2.6' fill='%235b8def'/></svg>">
<script>
  // Apply the saved theme before first paint, so there is no flash of the wrong theme.
  try { const t = JSON.parse(localStorage.getItem('apiman:settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="logo-bg"/><path d="M7 20c4 0 4-8 9-8s5 8 9 8" stroke="#f2b33d" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="7" cy="20" r="2.6" fill="#47b881"/><circle cx="25" cy="20" r="2.6" fill="#5b8def"/></svg>
      <span class="wordmark">ApiMan</span>
      <span class="pill" id="modeBadge"></span>
    </div>
    <div class="top-actions">
      <button id="btnNew" class="btn">New</button>
      <button id="btnImport" class="btn">Import</button>
      <button id="btnRunner" class="btn">Runner</button>
    </div>
    <div class="spacer"></div>
    <div class="env-picker">
      <label for="envSelect" class="sr-only">Environment</label>
      <span class="env-dot" id="envDot" aria-hidden="true"></span>
      <select id="envSelect" title="Active environment"></select>
      <button id="btnEnvPeek" class="btn icon" title="Quick look at variables" aria-label="Quick look at variables">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 10S4.8 4 10 4s8.5 6 8.5 6-3.3 6-8.5 6S1.5 10 1.5 10Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>
      </button>
    </div>
    <button id="btnTheme" class="btn icon" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 0 15Z" fill="currentColor"/><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button id="btnSettings" class="btn icon" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 6.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Zm7 4.4v-2.4l-2-.5a5.6 5.6 0 0 0-.6-1.4l1-1.8-1.7-1.7-1.8 1a5.6 5.6 0 0 0-1.4-.6L10 1.8H7.6l-.5 2a5.6 5.6 0 0 0-1.4.6l-1.8-1-1.7 1.7 1 1.8c-.3.4-.5.9-.6 1.4l-2 .5v2.4l2 .5c.1.5.3 1 .6 1.4l-1 1.8 1.7 1.7 1.8-1c.4.3.9.5 1.4.6l.5 2h2.4l.5-2c.5-.1 1-.3 1.4-.6l1.8 1 1.7-1.7-1-1.8c.3-.4.5-.9.6-1.4Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </header>

  <aside class="side">
    <div class="seg block" role="tablist" aria-label="Sidebar">
      <button role="tab" class="seg-btn on" data-view="collections" aria-selected="true">Collections</button>
      <button role="tab" class="seg-btn" data-view="environments" aria-selected="false">Environments</button>
      <button role="tab" class="seg-btn" data-view="history" aria-selected="false">History</button>
    </div>
    <div class="side-search">
      <input id="search" type="search" placeholder="Filter requests  /" aria-label="Filter" spellcheck="false" autocomplete="off">
    </div>
    <div class="side-body" id="sideBody"></div>
    <div class="side-foot">
      <div id="dataDir" class="data-dir"></div>
      <button id="btnFolder" class="btn small" hidden>Use a folder…</button>
    </div>
  </aside>

  <main class="work">
    <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Open requests"></div>

    <div class="welcome" id="welcome" hidden>
      <div class="welcome-inner">
        <h1>Send your first request</h1>
        <p>Paste a URL, import a Postman collection, or start from a cURL command. Everything stays on this computer.</p>
        <div class="welcome-actions">
          <button class="btn primary" data-act="new-request">New request</button>
          <button class="btn" data-act="import">Import collection</button>
          <button class="btn" data-act="import-curl">Paste cURL</button>
        </div>
      </div>
    </div>

    <div class="editor" id="editor" hidden>
      <div class="titlebar">
        <nav class="crumb" id="crumb" aria-label="Location"></nav>
        <input id="reqName" class="name-input" aria-label="Request name" spellcheck="false">
        <span class="dirty-dot" id="dirtyDot" title="Unsaved changes" hidden></span>
        <div class="spacer"></div>
        <button id="btnCode" class="btn ghost" title="Generate code">&lt;/&gt; Code</button>
        <button id="btnSave" class="btn" title="Save (Ctrl/Cmd+S)">Save</button>
      </div>

      <div class="reqbar" id="reqbar" data-method="GET">
        <select id="method" aria-label="Method">
          <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option>
          <option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
        </select>
        <input id="url" placeholder="Enter a URL, e.g. {{baseUrl}}/users" aria-label="URL" spellcheck="false" autocomplete="off">
        <button class="send" id="btnSend" title="Send (Ctrl/Cmd+Enter)">Send</button>
      </div>
      <div class="resolved" id="resolved" aria-live="polite"></div>

      <div class="split">
        <section class="pane-col req-col" aria-label="Request">
          <div class="tabs" id="reqTabs" role="tablist">
            <button class="tab on" data-tab="params">Params<span class="count" id="cntParams"></span></button>
            <button class="tab" data-tab="auth">Auth<span class="count" id="cntAuth"></span></button>
            <button class="tab" data-tab="headers">Headers<span class="count" id="cntHeaders"></span></button>
            <button class="tab" data-tab="body">Body<span class="count" id="cntBody"></span></button>
            <button class="tab" data-tab="scripts">Scripts<span class="count" id="cntScripts"></span></button>
            <button class="tab" data-tab="docs">Docs</button>
          </div>
          <div class="pane" data-pane="params"><div id="paramsKv"></div></div>
          <div class="pane" data-pane="auth" hidden><div id="authEditor"></div></div>
          <div class="pane" data-pane="headers" hidden><div id="headersKv"></div></div>
          <div class="pane" data-pane="body" hidden>
            <div class="pane-tools">
              <div class="seg" id="bodyModes" role="radiogroup" aria-label="Body type"></div>
              <span id="bodyExtras" class="field-row"></span>
            </div>
            <div id="bodyEditor"></div>
          </div>
          <div class="pane" data-pane="scripts" hidden>
            <div class="pane-tools">
              <div class="seg" role="radiogroup" aria-label="Script">
                <button class="seg-btn on" data-script="pre">Pre-request</button>
                <button class="seg-btn" data-script="test">Tests</button>
              </div>
              <button class="btn small ghost" id="btnSnippets">Snippets</button>
              <span class="hint">Runs sandboxed: no network calls of its own, no access to stored data.</span>
            </div>
            <textarea class="code" id="scriptText" spellcheck="false" aria-label="Script"></textarea>
          </div>
          <div class="pane" data-pane="docs" hidden>
            <textarea class="prose" id="docsText" aria-label="Documentation" placeholder="Describe what this request does, its parameters and gotchas."></textarea>
          </div>
        </section>

        <section class="pane-col resp-col" aria-label="Response">
          <div class="tabs" id="respTabs" role="tablist">
            <button class="tab on" data-tab="rbody">Body</button>
            <button class="tab" data-tab="rheaders">Headers<span class="count" id="cntRHeaders"></span></button>
            <button class="tab" data-tab="rcookies">Cookies<span class="count" id="cntRCookies"></span></button>
            <button class="tab" data-tab="rtests">Tests<span class="count" id="cntRTests"></span></button>
            <button class="tab" data-tab="rconsole">Console<span class="count" id="cntRConsole"></span></button>
            <div class="resp-meta" id="respStatus"></div>
          </div>
          <div class="pane" data-pane="rbody">
            <div class="pane-tools" id="respTools" hidden>
              <div class="seg" role="radiogroup" aria-label="Body view">
                <button class="seg-btn on" data-view="pretty">Pretty</button>
                <button class="seg-btn" data-view="raw">Raw</button>
                <button class="seg-btn" data-view="preview">Preview</button>
              </div>
              <div class="spacer"></div>
              <button class="btn small ghost" id="btnCopyBody">Copy</button>
              <button class="btn small ghost" id="btnSaveBody">Save to file</button>
            </div>
            <div id="respBody" class="resp-body"></div>
          </div>
          <div class="pane" data-pane="rheaders" hidden><table class="grid" id="respHeaders"></table></div>
          <div class="pane" data-pane="rcookies" hidden><div id="respCookies"></div></div>
          <div class="pane" data-pane="rtests" hidden><div id="respTests"></div></div>
          <div class="pane" data-pane="rconsole" hidden><div id="respConsole" class="console"></div></div>
        </section>
      </div>
    </div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" class="dlg-shell">
    <header class="dlg-head"><h2 id="dlgTitle"></h2><button class="btn icon" value="cancel" aria-label="Close" title="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></header>
    <div class="dlg-body" id="dlgBody"></div>
    <footer class="dlg-foot" id="dlgFoot"></footer>
  </form>
</dialog>

<div id="popover" class="popover" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
